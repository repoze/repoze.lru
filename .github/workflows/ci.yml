name: "Lint / unit tests / coverage"

on:
  pull_request:
    branches:
      - master


jobs:

  lint:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.14

    - name: Install tox
      run: |
        python -m pip install --upgrade setuptools pip wheel
        python -m pip install tox

    - name: Run linting
      run: |
        tox -e lint

  run-unittests:
    name: unit-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:

    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python }}

    - name: Install tox
      run: |
        python -m pip install --upgrade setuptools pip wheel
        python -m pip install tox

    - name: Run unit tests
      run: |
        tox -e py${{ matrix.python }}

  report-coverage:
    name: cover
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.14

    - run: pip install tox
    - run: tox -e py314,coverage
